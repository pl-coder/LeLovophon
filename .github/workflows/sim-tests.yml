name: sim tests

on:
  push:
    paths: ["sim/**", ".github/workflows/sim-tests.yml"]
  pull_request:
    paths: ["sim/**", ".github/workflows/sim-tests.yml"]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s sim/tests
